<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400;1,700&family=Roboto+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <title>CoC Rank Dashboard (Fan Tool)</title>
    <script>
      (function() {
        try {
          var key = 'coc_rank_theme';
          var stored = localStorage.getItem(key);
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Chống chớp trắng (Anti-FOUC) khi tải trang */
      html.dark, html.dark body {
        background-color: #070a13 !important;
        color: #e2e8f0;
        color-scheme: dark;
      }
      html.light, html.light body {
        background-color: #f8fafc !important;
        color: #0f172a;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        html:not(.light), html:not(.light) body {
          background-color: #070a13;
          color: #e2e8f0;
          color-scheme: dark;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
